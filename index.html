<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة إسماعيل التعليمية</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<!-- الهيدر الرئيسي -->
<header class="header">

    <div class="profile-box">

        <img src="images/ismail.jpg" class="profile-img" alt="صورة إسماعيل">

        <h1>منصة إسماعيل التعليمية</h1>

        <p>كتب المرحلة الثانوية - نظام تعليمي متكامل</p>

    </div>

    <input type="text" id="search" placeholder="ابحث عن كتاب أو مادة...">

</header>

<!-- المحتوى -->
<main>

    <section class="info">
        <h2>📚 المكتبة التعليمية</h2>
        <p>اختر الكتاب الذي تريد قراءته أو تحميله مباشرة</p>
    </section>

    <!-- الكتب -->
    <section id="container" class="books-container"></section>

</main>

<!-- عارض PDF -->
<div id="viewer" class="viewer">

    <div class="viewer-box">

        <button class="close-btn" onclick="closeBook()">
            ✖ إغلاق
        </button>

        <iframe id="pdf"></iframe>

    </div>

</div>

<!-- ربط الجافاسكربت -->
<script src="script.js"></script>

</body>
</html>
