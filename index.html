<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مكتبة إسماعيل الثانوية</title>

<link rel="stylesheet" href="style.css">

<!-- خط عربي قوي وجميل -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

</head>

<body>

<!-- HERO SECTION -->
<section class="hero">

    <img src="images/ismail.jpg" class="hero-img">

    <h1>مكتبة إسماعيل الثانوية</h1>

    <p>منصة تعليمية لكتب المرحلة الثانوية</p>

    <button onclick="scrollDown()">📚 تصفح الكتب</button>

</section>

<!-- SEARCH -->
<div class="search-box">
    <input type="text" id="search" placeholder="ابحث عن كتاب...">
</div>

<!-- BOOKS -->
<section id="booksContainer" class="books"></section>

<!-- PDF VIEWER -->
<div id="viewer" class="viewer">
    <div class="viewer-box">
        <span onclick="closeBook()">✖ إغلاق</span>
        <iframe id="pdfFrame"></iframe>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
