<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة إسماعيل الثانوية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">

    <img src="ismail.jpg" alt="إسماعيل سليمان حسن" class="hero-img">

    <h1>مكتبة إسماعيل الثانوية</h1>

    <p>
        الأستاذ إسماعيل سليمان حسن<br>
        معلم رياضيات وحاسوب – خبرة طويلة في التعليم
    </p>

    <button onclick="scrollToBooks()">
        تصفح الكتب
    </button>

</section>

<section class="search-section">

    <h2>📚 الكتب الدراسية</h2>

    <input
        type="text"
        id="search"
        placeholder="ابحث عن كتاب..."
    >

</section>

<section id="booksContainer" class="books"></section>

<div id="viewer" class="viewer">

    <div class="viewer-box">

        <button class="close-btn" onclick="closeBook()">
            ✖ إغلاق
        </button>

        <iframe id="pdfFrame"></iframe>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
